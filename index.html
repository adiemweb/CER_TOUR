<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Virtual Tour Server Room</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .controls-card {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(18, 18, 18, 0.85);
      backdrop-filter: blur(8px);
      color: #ffffff;
      padding: 12px 20px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 13px;
      text-align: center;
      pointer-events: none;
      z-index: 10;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #00d2ff;
      font-size: 16px;
      font-weight: bold;
      pointer-events: none;
      z-index: 20;
    }
  </style>
</head>
<body>

  <div id="loading">Memuat Model 3DGS...</div>

  <div class="controls-card">
    <b>Kontrol Navigasi</b><br>
    🖥️ <b>Desktop:</b> Klik Kiri (Rotasi) | Scroll (Zoom) | Klik Kanan (Pan)<br>
    📱 <b>Mobile:</b> 1 Jari (Rotasi) | 2 Jari (Zoom & Geser)
  </div>

  <script type="module">
    import * as GaussianSplats3D from 'https://cdn.jsdelivr.net/npm/@mkkellogg/gaussian-splat-3d@0.4.2/build/gaussian-splats-3d.module.js';

    // Mengambil file PLY langsung dari Hugging Face via Raw LFS Pointer bypass
    const url = 'https://huggingface.co/datasets/ADIADMMEDIA/CER/raw/main/rack.ply';

    const viewer = new GaussianSplats3D.Viewer({
      'cameraUp': [0, -1, 0],
      'initialCameraPosition': [0, 0, 3],
      'initialCameraLookAt': [0, 0, 0],
      'rootElement': document.body,
      'selfManaged': true
    });

    viewer.addSplatScene(url, {
      'splatAlphaRemovalThreshold': 5,
      'showLoadingUI': true
    }).then(() => {
      document.getElementById('loading').style.display = 'none';
      viewer.start();
    }).catch((err) => {
      console.error(err);
      document.getElementById('loading').innerText = 'Gagal memuat file.';
    });
  </script>

</body>
</html>
