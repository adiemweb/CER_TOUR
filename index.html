<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Virtual Tour Server Room</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #050505;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #viewer-container {
      width: 100vw;
      height: 100vh;
      display: block;
    }
    .controls-card {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(18, 18, 18, 0.85);
      backdrop-filter: blur(8px);
      color: #ffffff;
      padding: 12px 20px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 13px;
      text-align: center;
      pointer-events: none;
      z-index: 10;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }
  </style>

  <!-- Load Engine SuperSplat Viewer -->
  <script type="module" src="https://cdn.jsdelivr.net/npm/@playcanvas/supersplat/dist/supersplat.js"></script>
</head>
<body>

  <!-- Container Viewer Terhubung Langsung ke Google Drive -->
  <supersplat-viewer 
    id="viewer-container" 
    src="https://corsproxy.io/?https://drive.google.com/uc?export=download&id=1MFP3MjVPha60EatUXwEjVG43YyPXwm_o">
  </supersplat-viewer>

  <!-- Overlay Petunjuk Kontrol -->
  <div class="controls-card">
    <b>Kontrol Navigasi</b><br>
    🖥️ <b>Desktop:</b> Klik Kiri (Rotasi) | Scroll (Zoom) | Klik Kanan (Pan)<br>
    📱 <b>Mobile:</b> 1 Jari (Rotasi) | 2 Jari (Zoom & Geser)
  </div>

</body>
</html>
